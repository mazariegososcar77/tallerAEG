server {
    listen 80;
    server_name _;

    # Sin límite de tamaño de subida (0 = nginx no lo revisa). El video crudo del
    # reporte de trabajo (sin comprimir todavía, antes de que ffmpeg lo achique)
    # puede pesar varios cientos de MB en celulares que graban 4K/8K, aun dentro
    # de los 30s permitidos -- cualquier número fijo aquí vuelve a taparse con el
    # mismo problema tarde o temprano. El backend ya no tiene tope propio para el
    # video (ver upload.middleware.js); para fotos (máx. 12MB) y documentos
    # (máx. 20MB) el límite real lo sigue poniendo el backend, esto solo deja de
    # ser un segundo guardián desalineado con esos topes.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API y los uploads hacia el backend (misma red de Docker).
    # El navegador siempre habla con este nginx (mismo origen) -> sin CORS.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagenes subidas (fotos de articulos, reportes, firmas). El backend
    # guarda cada url como "/uploads/<archivo>" pero solo las sirve el mismo
    # bajo "/api/uploads/" (ver app.js) -> aqui se reescribe la ruta para que
    # ambas coincidan, sin tener que tocar las urls ya guardadas en la base.
    location /uploads/ {
        proxy_pass http://backend:4000/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
