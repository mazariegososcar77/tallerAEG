server {
    listen 80;
    server_name _;

    # Tamaño máximo de subida. 200m porque el video crudo del reporte de trabajo
    # (sin comprimir todavía, antes de que ffmpeg lo achique) puede pesar varias
    # decenas de MB incluso durando los 30s permitidos -- el mismo límite que ya
    # exige el backend (ver MAX_VIDEO_SIZE_MB en upload.middleware.js). Con 20m
    # (pensado solo para fotos, máximo 12MB) nginx rechazaba el video con un 413
    # antes de que llegara al backend, y como esa respuesta no es JSON el
    # frontend mostraba el genérico "Ocurrió un error inesperado".
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API y los uploads hacia el backend (misma red de Docker).
    # El navegador siempre habla con este nginx (mismo origen) -> sin CORS.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagenes subidas (fotos de articulos, reportes, firmas). El backend
    # guarda cada url como "/uploads/<archivo>" pero solo las sirve el mismo
    # bajo "/api/uploads/" (ver app.js) -> aqui se reescribe la ruta para que
    # ambas coincidan, sin tener que tocar las urls ya guardadas en la base.
    location /uploads/ {
        proxy_pass http://backend:4000/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
