name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - developer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Definir entorno según rama
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/home/oscar/tallerAEG" >> $GITHUB_OUTPUT
            echo "project=talleraeg-prod" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "path=/home/oscar/tallerAEG-dev" >> $GITHUB_OUTPUT
            echo "project=talleraeg-dev" >> $GITHUB_OUTPUT
            echo "branch=developer" >> $GITHUB_OUTPUT
          fi

      - name: Desplegar en la VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            set -e
            cd ${{ steps.env.outputs.path }}
            git fetch origin ${{ steps.env.outputs.branch }}
            git reset --hard origin/${{ steps.env.outputs.branch }}
            cd docker
            docker compose -p ${{ steps.env.outputs.project }} up -d --build
            docker image prune -f
          EOF