# Orquestacion del Sistema Taller AEG
services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME:-talleraeg}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talleraeg}
      MYSQL_USER: ${MYSQL_USER:-aeg_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ../backend/migraciones:/docker-entrypoint-initdb.d
    networks:
      - talleraeg
    # Publicado SOLO en localhost de la VM. El puerto del host cambia por entorno
    # (prod=3307, dev=3308). El contenedor sigue en 3306 internamente.
    # Tunel SSH -> ssh -L 3306:localhost:${DB_HOST_PORT} usuario@<IP_DE_LA_VM>
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
  backend:
    # La imagen la construye y publica GitHub Actions en GHCR
    # (.github/workflows/cd.yml). Aqui NO hay "build:" a proposito: la VM tiene
    # 1.9 GB de RAM y compilar en ella dejaba el deploy colgado por falta de
    # memoria. Si hace falta construir a mano: docker build ../backend
    #
    # El deploy fija IMAGE_TAG al SHA del commit. El default (dev) sirve para
    # levantar a mano la ultima imagen publicada de esa rama.
    image: ${IMAGE_PREFIX:-ghcr.io/mazariegososcar77}/talleraeg-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 8h
      CORS_ORIGIN: "*"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-talleraeg}
      DB_USER: ${MYSQL_USER:-aeg_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Facturacion electronica (Digifact FEL). Vacias = felCertifier sigue en modo simulador.
      DIGIFACT_ENV: ${DIGIFACT_ENV:-test}
      DIGIFACT_NIT: ${DIGIFACT_NIT:-}
      DIGIFACT_USERNAME: ${DIGIFACT_USERNAME:-}
      DIGIFACT_PASSWORD: ${DIGIFACT_PASSWORD:-}
      DIGIFACT_EMISOR_NIT: ${DIGIFACT_EMISOR_NIT:-}
      DIGIFACT_AFILIACION_IVA: ${DIGIFACT_AFILIACION_IVA:-GEN}
      DIGIFACT_FRASE: ${DIGIFACT_FRASE:-1}
      DIGIFACT_ESCENARIO: ${DIGIFACT_ESCENARIO:-1}
      DIGIFACT_ESTABLECIMIENTO_CODIGO: ${DIGIFACT_ESTABLECIMIENTO_CODIGO:-1}
      DIGIFACT_ESTABLECIMIENTO_NOMBRE: ${DIGIFACT_ESTABLECIMIENTO_NOMBRE:-}
      DIGIFACT_EMISOR_NOMBRE: ${DIGIFACT_EMISOR_NOMBRE:-}
      DIGIFACT_EMISOR_DIRECCION: ${DIGIFACT_EMISOR_DIRECCION:-}
      DIGIFACT_EMISOR_MUNICIPIO: ${DIGIFACT_EMISOR_MUNICIPIO:-}
      DIGIFACT_EMISOR_DEPARTAMENTO: ${DIGIFACT_EMISOR_DEPARTAMENTO:-}
      DIGIFACT_EMISOR_CODIGO_GEOGRAFICO: ${DIGIFACT_EMISOR_CODIGO_GEOGRAFICO:-}
      DIGIFACT_EMISOR_EMAIL: ${DIGIFACT_EMISOR_EMAIL:-}
    volumes:
      - backend_data:/app/src/data
      - backend_uploads:/app/uploads
    networks:
      - talleraeg
    expose:
      - "4000"
  frontend:
    # Igual que el backend: imagen ya construida, la VM solo la descarga. Este era
    # el build que se colgaba (el `vite build` de rollup pide ~1-1.5 GB).
    image: ${IMAGE_PREFIX:-ghcr.io/mazariegososcar77}/talleraeg-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    networks:
      - talleraeg
networks:
  talleraeg:
    driver: bridge
volumes:
  db_data:
  backend_data:
  backend_uploads: