# Orquestacion del Sistema Taller AEG
services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME:-talleraeg}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talleraeg}
      MYSQL_USER: ${MYSQL_USER:-aeg_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ../backend/migraciones:/docker-entrypoint-initdb.d
    networks:
      - talleraeg
    # Publicado SOLO en localhost de la VM. El puerto del host cambia por entorno
    # (prod=3307, dev=3308). El contenedor sigue en 3306 internamente.
    # Tunel SSH -> ssh -L 3306:localhost:${DB_HOST_PORT} usuario@<IP_DE_LA_VM>
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-talleraeg}-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 8h
      CORS_ORIGIN: "*"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-talleraeg}
      DB_USER: ${MYSQL_USER:-aeg_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - backend_data:/app/src/data
      - backend_uploads:/app/uploads
    networks:
      - talleraeg
    expose:
      - "4000"
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-talleraeg}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    networks:
      - talleraeg
networks:
  talleraeg:
    driver: bridge
volumes:
  db_data:
  backend_data:
  backend_uploads: